"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$git_metrics\
$package\
$bun\
$docker_context\
$nix_shell\
$cmd_duration\
$line_break\
$character"""

add_newline = false

[line_break]
disabled = true

[character]
format = " $symbol "
success_symbol = "[▲](bold #f97316)"
error_symbol = "[▲](bold #ef4444)"
vimcmd_symbol = "[▲](bold #fb923c)"

[directory]
format = "[$path]($style)"
style = "bold"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = ""

[git_branch]
symbol = ""
format = " [\\[$branch\\]]($style)"
style = "bold"
truncation_length = 24
truncation_symbol = "…"

[git_status]
format = " ([\\[$all_status\\]]($style))"
style = "bold #eab308"
conflicted = ""
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = ""
stashed = ""
modified = ""
staged = ""
renamed = ""
deleted = ""
disabled = false

[git_metrics]
format = '([+$added](#fb923c) [-$deleted](#ef4444))'
disabled = false

[package]
format = " [\\[$version\\]](bold)"
disabled = true

[bun]
format = " [bun \\[$version\\]](bold #f97316)"
disabled = false

[nodejs]
format = " [\\[$version\\]](bold #22c55e)"
disabled = true

[docker_context]
format = " [\\[$context\\]](bold #2491d1)"
symbol = " "
disabled = false

[nix_shell]
format = " [\\[$state( $name)\\]](bold #7ebae4)"
symbol = " "

[cmd_duration]
min_time = 2000
format = " [$duration](#666666)"
style = "#666666"

[time]
disabled = true

[username]
disabled = true

[hostname]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[terraform]
disabled = true

[aws]
disabled = true

[kubernetes]
disabled = true